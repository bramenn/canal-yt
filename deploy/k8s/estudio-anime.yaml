# Estudio Anime en el k3s de Contabo: https://anime.bramen.org (Cloudflare hace el TLS; aquí solo Ingress http).
# Comparte con Estudio Fútbol (deploy/k8s/estudio-futbol.yaml) el namespace, Postgres (mismos usuarios; sus shorts
# van en la tabla «animes») y el disco estudio-data: carpeta propia para sus shorts y la misma sesión de
# ChatGPT/Codex, claves (ElevenLabs, Brave) y modelos de Whisper. El disco es de un solo nodo: los pods van al mismo.
# Piloto automático (AUTOPILOT=1): 1 short nuevo + 2 de los largos al día y un largo martes y viernes, publicados con Buffer.
# Todo el tráfico de salida va por Cloudflare WARP (WireGuard, init «warp»): nyaa/BitTorrent y YouTube bloquean IPs de
# centros de datos. Secretos: anime-env (claves de .env) y anime-warp (wg0.conf de la cuenta WARP).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: estudio-anime
  namespace: estudio-futbol
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: estudio-anime } }
  template:
    metadata: { labels: { app: estudio-anime } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      initContainers:
        # túnel WARP para todo el pod: la ruta por defecto va por wg0; el clúster (pods, servicios) y los nodos, por eth0
        - name: warp
          image: docker.io/library/alpine:3.20
          securityContext: { capabilities: { add: [NET_ADMIN] } }
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache wireguard-tools-wg iproute2 >/dev/null
              GW=$(ip route | awk '/^default/ {print $3}')
              ENDPOINT=$(awk -F'[ =:]+' '/^Endpoint/ {print $2}' /warp/wg0.conf)
              ip link add wg0 type wireguard
              wg setconf wg0 /warp/wg0.conf
              ip addr add 172.16.0.2/32 dev wg0
              ip link set mtu 1280 up dev wg0
              for n in $ENDPOINT/32 10.42.0.0/16 10.43.0.0/16 167.86.102.102/32 173.212.231.144/32; do ip route replace $n via $GW dev eth0; done
              ip route replace default dev wg0
              wget -qO- https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp)='
          volumeMounts: [{ name: warp, mountPath: /warp, readOnly: true }]
        # local-path no aplica fsGroup: la carpeta se prepara para el usuario "node" (1000) de la imagen
        - name: permisos
          image: docker.io/library/busybox:1.37
          command: [sh, -c, 'mkdir -p /data/anime-projects && chown 1000:1000 /data/anime-projects']
          volumeMounts: [{ name: data, mountPath: /data }]
      containers:
        - name: app
          image: ghcr.io/bramenn/estudio-anime:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4324 }]
          envFrom: [{ secretRef: { name: anime-env } }]
          env:
            - { name: AUTOPILOT, value: '1' }
            - { name: YOUTUBE_OFF, value: '1' }   # YouTube bloquea las IPs de servidor y de WARP: escenas de nyaa e imágenes
            - { name: PUBLIC_MEDIA_DIR, value: /app/anime/projects/pub }
            - { name: PUBLIC_MEDIA_URL, value: https://bramen.org/nt-pub }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: futbol-db, key: DATABASE_URL } }
            - { name: SECURE_COOKIES, value: '1' }
            - { name: CLIENT_IP_HEADER, value: cf-connecting-ip }
            - { name: CODEX_IPV4, value: '1' }   # el clúster no tiene salida IPv6: Codex sale por un puente IPv4
          readinessProbe:
            httpGet: { path: /login, port: 4324 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /login, port: 4324 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            # ffmpeg y Whisper (alinear la voz)
            # el nodo ya tiene casi toda la memoria reservada: se pide poco y se usa lo que haya libre
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 3Gi }
          volumeMounts:
            - { name: data, mountPath: /app/anime/projects, subPath: anime-projects } # tráileres, voz y MP4
            - { name: data, mountPath: /app/.secrets, subPath: secrets }
            - { name: data, mountPath: /home/node/.cache, subPath: cache }
            - { name: data, mountPath: /home/node/.codex, subPath: codex }
            - { name: data, mountPath: /home/node/.claude, subPath: claude }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: estudio-data }
        - name: warp
          secret: { secretName: anime-warp, defaultMode: 0400 }
---
apiVersion: v1
kind: Service
metadata:
  name: estudio-anime
  namespace: estudio-futbol
spec:
  selector: { app: estudio-anime }
  ports: [{ port: 80, targetPort: 4324 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: estudio-anime
  namespace: estudio-futbol
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-request-buffering: 'off'
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
spec:
  ingressClassName: nginx
  rules:
    - host: anime.bramen.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: estudio-anime, port: { number: 80 } }
---
# Buffer descarga los vídeos de aquí al publicarlos (bramen.org ya tiene DNS y TLS en Cloudflare)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: estudio-anime-pub
  namespace: estudio-futbol
spec:
  ingressClassName: nginx
  rules:
    - host: bramen.org
      http:
        paths:
          - path: /nt-pub/
            pathType: Prefix
            backend:
              service: { name: estudio-anime, port: { number: 80 } }
