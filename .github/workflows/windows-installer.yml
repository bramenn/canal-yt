# Instalador de Windows de Estudio Futbol: empaqueta la app con todo lo que necesita (Node, Python con sus librerías,
# ffmpeg, Claude Code, Codex y CapCutAPI), la prueba en Windows y genera EstudioFutbol-Setup-<versión>.exe.
# - Manual: pestaña Actions → «Instalador de Windows» → Run workflow (el .exe queda en los artefactos).
# - Con una etiqueta v* (git tag v1.0.0 && git push --tags) además se publica en Releases.
name: Instalador de Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NODE_VERSION: 22.12.0
      PYTHON_VERSION: 3.12.8
      CAPCUT_API_REF: 1dcf4cd4951b2c749929f58096c90679074c32cc
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.1.$env:GITHUB_RUN_NUMBER" }
          "APP_VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "Versión $v"

      - name: Copiar la app
        run: |
          $app = 'dist/app'
          New-Item -ItemType Directory -Force "$app/public" | Out-Null
          Copy-Item -Recurse lib "$app/lib"
          Copy-Item -Recurse public/js "$app/public/js"
          Copy-Item -Recurse futbol "$app/futbol"
          Remove-Item -Recurse -Force "$app/futbol/projects", "$app/futbol/windows" -ErrorAction SilentlyContinue
          Copy-Item package.json "$app/"
          Copy-Item "futbol/windows/Estudio Futbol.cmd" "$app/"

      - name: Node portátil
        run: |
          Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath tmp-node
          Move-Item "tmp-node/node-v$env:NODE_VERSION-win-x64" dist/app/node

      - name: Claude Code y Codex
        run: |
          & dist/app/node/npm.cmd install --prefix dist/app/tools --no-audit --no-fund @anthropic-ai/claude-code @openai/codex
          if ($LASTEXITCODE) { exit 1 }
          # el lanzador necesita la ruta de cada CLI: la del campo "bin" de su package.json (un .js se lanza con Node)
          $root = (Resolve-Path dist/app).Path
          function BinOf($pkg, $name) {
            $dir = Join-Path $root "tools/node_modules/$pkg"
            $j = Get-Content (Join-Path $dir 'package.json') -Raw | ConvertFrom-Json
            $b = if ($j.bin -is [string]) { $j.bin } else { $j.bin.$name }
            return [IO.Path]::GetRelativePath($root, (Resolve-Path (Join-Path $dir $b)).Path)
          }
          $claude = BinOf '@anthropic-ai/claude-code' 'claude'
          $codex = BinOf '@openai/codex' 'codex'
          "@set `"CLAUDE_BIN=%~dp0$claude`"`r`n@set `"CODEX_BIN=%~dp0$codex`"`r`n" | Set-Content -NoNewline -Encoding ascii dist/app/bins.cmd
          Get-Content dist/app/bins.cmd

      - name: ffmpeg
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath tmp-ffmpeg
          New-Item -ItemType Directory -Force dist/app/ffmpeg | Out-Null
          Get-ChildItem tmp-ffmpeg -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination dist/app/ffmpeg/

      - name: Python portátil y librerías
        run: |
          $py = 'dist/app/python'
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-embed-amd64.zip" -OutFile py.zip
          Expand-Archive py.zip -DestinationPath $py
          # el Python "embeddable" no carga librerías instaladas hasta activar "import site"
          $pth = Get-ChildItem $py -Filter 'python*._pth' | Select-Object -First 1
          (Get-Content $pth.FullName) -replace '^#\s*import site', 'import site' | Set-Content $pth.FullName
          Invoke-WebRequest https://bootstrap.pypa.io/get-pip.py -OutFile get-pip.py
          & "$py/python.exe" get-pip.py --no-warn-script-location
          # fotos (ddgs), sincronizar la voz (faster-whisper), clips (yt-dlp), recortar al jugador (rembg)
          & "$py/python.exe" -m pip install --no-warn-script-location ddgs faster-whisper numpy yt-dlp "rembg[cpu]"
          if ($LASTEXITCODE) { exit 1 }

      - name: CapCutAPI (exportar a CapCut)
        run: |
          git clone --quiet https://github.com/sun-guannan/CapCutAPI dist/app/CapCutAPI
          git -C dist/app/CapCutAPI checkout --quiet $env:CAPCUT_API_REF
          Remove-Item -Recurse -Force dist/app/CapCutAPI/.git
          # algunas dependencias (oss2, crcmod…) solo vienen como código fuente: el Python portátil necesita setuptools
          # y compilar sin entorno aislado (en el aislado no ve sus propias librerías)
          & dist/app/python/python.exe -m pip install --no-warn-script-location setuptools wheel
          & dist/app/python/python.exe -m pip install --no-warn-script-location --no-build-isolation -r dist/app/CapCutAPI/requirements.txt
          if ($LASTEXITCODE) { exit 1 }
          # todo en local: nunca sube borradores a servicios externos
          '{ "draft_profile": "capcut_legacy", "is_capcut_env": true, "draft_domain": "https://www.capcutapi.top", "port": 9001, "preview_router": "/draft/downloader", "is_upload_draft": false }' |
            Set-Content -Encoding utf8 dist/app/CapCutAPI/config.json

      - name: Probar la app en Windows
        run: |
          $app = (Resolve-Path dist/app).Path
          $env:PATH = "$app\node;$app\python;$app\python\Scripts;$app\ffmpeg;$env:PATH"
          $env:IMG_PYTHON = "$app\python\python.exe"; $env:ALIGN_PYTHON = $env:IMG_PYTHON; $env:CAPCUT_PYTHON = $env:IMG_PYTHON
          $env:YTDLP_BIN = "$app\python\Scripts\yt-dlp.exe"; $env:CAPCUT_DIR = "$app\CapCutAPI"
          $env:PROJECTS_DIR = "$pwd\test-projects"
          foreach ($line in Get-Content "$app\bins.cmd") { if ($line -match '@set "(\w+)=%~dp0(.+)"') { Set-Item "env:$($Matches[1])" (Join-Path $app $Matches[2]) } }

          ffmpeg -version | Select-Object -First 1
          & $env:IMG_PYTHON -c "import ddgs, faster_whisper, rembg, numpy; print('Python: librerías OK')"
          if ($LASTEXITCODE) { exit 1 }
          & $env:YTDLP_BIN --version
          & $env:IMG_PYTHON -c "import os, sys; os.chdir(r'$app\CapCutAPI'); sys.path.insert(0, '.'); import create_draft, add_image_impl, save_draft_impl; print('CapCutAPI OK')"
          if ($LASTEXITCODE) { exit 1 }
          foreach ($bin in $env:CLAUDE_BIN, $env:CODEX_BIN) {
            $out = if ($bin -match '\.(c|m)?js$') { & "$app\node\node.exe" $bin --version } else { & $bin --version }
            Write-Host "$(Split-Path $bin -Leaf): $out"
            if ($LASTEXITCODE) { exit 1 }
          }

          $srv = Start-Process "$app\node\node.exe" -ArgumentList 'futbol/server.js' -WorkingDirectory $app -PassThru -RedirectStandardOutput srv.log -RedirectStandardError srv.err
          $status = $null
          for ($i = 0; $i -lt 40 -and -not $status; $i++) { Start-Sleep 1; try { $status = Invoke-RestMethod http://127.0.0.1:4322/api/status } catch {} }
          if (-not $status) { Get-Content srv.log, srv.err; exit 1 }
          $status | ConvertTo-Json -Depth 5
          $problems = @()
          if (-not $status.ai.claude.installed) { $problems += 'Claude Code no se encuentra' }
          if (-not $status.ai.codex.installed) { $problems += 'Codex no se encuentra' }
          if (-not $status.align.available) { $problems += 'faster-whisper no carga' }
          if (-not $status.capcut.available) { $problems += 'CapCutAPI no se encuentra' }
          # depende de buscadores externos: si fallan aquí es un aviso, no un error del instalador
          try { $search = Invoke-RestMethod "http://127.0.0.1:4322/api/media/search?q=Lionel%20Messi"; Write-Host "Búsqueda de fotos: $($search.items.Count) resultados ($($search.engine))" }
          catch { Write-Host "::warning::La búsqueda de fotos no respondió en el runner: $($_.Exception.Message)" }
          $page = Invoke-WebRequest http://127.0.0.1:4322/ -UseBasicParsing
          if ($page.StatusCode -ne 200) { $problems += 'la página no carga' }
          Stop-Process -Id $srv.Id -Force
          if ($problems) { Write-Host "FALLOS: $($problems -join '; ')"; Get-Content srv.err; exit 1 }
          Write-Host 'La app funciona en Windows'

      - name: Crear el instalador
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc futbol/windows/installer.iss
          if ($LASTEXITCODE) { exit 1 }
          Get-ChildItem dist/*.exe | ForEach-Object { "{0} · {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: EstudioFutbol-Setup-${{ env.APP_VERSION }}
          path: dist/EstudioFutbol-Setup-*.exe
          retention-days: 30

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EstudioFutbol-Setup-*.exe
